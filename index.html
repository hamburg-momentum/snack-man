<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Snack-Man</title>
<style>
:root{--bg:#fff;--surface:#f9f8f7;--text:#2c2c2b;--muted:#7d7a75;--line:#e6e5e3;--blue:#2783de;--blueSoft:#e5f2fc;--gold:#f4bd3f;--red:#e56458}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Arial,system-ui,sans-serif}.app{max-width:920px;margin:auto;padding:20px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}h1{font-size:34px;line-height:1;margin:5px 0 0;letter-spacing:-.04em}.stats{display:flex;gap:8px}.stat{min-width:90px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:18px}.boardWrap{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}canvas{display:block;width:100%;height:auto;max-height:520px;background:#111722;border-radius:8px}.overlay{position:absolute;inset:12px;display:grid;place-items:center;background:rgba(17,23,34,.7);border-radius:8px;color:#fff;text-align:center;padding:24px}.overlay[hidden]{display:none}.card{max-width:390px;padding:24px;border-radius:12px;background:rgba(25,25,25,.92);border:1px solid rgba(255,255,255,.2)}.card h2{margin:0 0 8px;font-size:26px}.card p{margin:0 0 18px;color:rgba(255,255,255,.7)}button{min-height:44px;border:0;border-radius:8px;padding:0 16px;font:700 15px Arial;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:hover{filter:brightness(.94)}.primary:focus-visible,.key:focus-visible{outline:3px solid #fff;outline-offset:2px}.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:12px;color:var(--muted);font-size:14px}.keys{display:flex;gap:5px}.key{width:44px;padding:0;border:1px solid var(--line);background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}.mobile{display:none}.legend{white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:5px}.heart{color:var(--red);letter-spacing:2px}@media(max-width:620px){.app{padding:14px}.top{align-items:start}.stats{flex-direction:column}.stat{min-width:82px}h1{font-size:28px}.card{padding:12px 14px}.card h2{font-size:22px;margin-bottom:4px}.card p{font-size:14px;line-height:1.3;margin-bottom:8px}.desktop{display:none}.mobile{display:grid;grid-template-columns:repeat(3,44px);gap:5px}.mobile .up{grid-column:2}.mobile .left{grid-column:1}.mobile .down{grid-column:2}.mobile .right{grid-column:3}.foot{align-items:end}.legend{white-space:normal;max-width:160px}}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#202020;--text:#fff;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.2);--blue:#5e9fe8;--blueSoft:#1e3045}.key{background:#383836;color:#fff}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app" aria-label="Snack-Man Spiel">
  <header class="top">
    <div><div class="eyebrow">Momentum Arcade</div><h1>Snack-Man</h1></div>
    <div class="stats" aria-live="polite"><div class="stat"><span>Punkte</span><b id="score">0</b></div><div class="stat"><span>Leben</span><b id="lives" class="heart">♥♥♥</b></div></div>
  </header>
  <section class="boardWrap">
    <canvas id="game" width="840" height="504" aria-label="Spielfeld: Sammle alle Snacks und meide die roten Störenfriede"></canvas>
    <div class="overlay" id="overlay"><div class="card"><h2 id="overlayTitle">Hungrig?</h2><p id="overlayText">Sammle alle Snacks. Die roten Störenfriede haben andere Pläne.</p><button class="primary" id="start">Spiel starten</button></div></div>
  </section>
  <footer class="foot">
    <div class="legend"><span class="dot"></span>Snack sammeln · <b>P</b> Pause</div>
    <div class="keys desktop" aria-label="Steuerung"><button class="key" data-dir="left">←</button><button class="key" data-dir="up">↑</button><button class="key" data-dir="down">↓</button><button class="key" data-dir="right">→</button></div>
    <div class="mobile" aria-label="Steuerung"><button class="key up" data-dir="up">↑</button><button class="key left" data-dir="left">←</button><button class="key down" data-dir="down">↓</button><button class="key right" data-dir="right">→</button></div>
  </footer>
</main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),text=document.getElementById('overlayText'),startBtn=document.getElementById('start');
const map=[
'#####################',
'#.........#.........#',
'#.###.###.#.###.###.#',
'#o###.###.#.###.###o#',
'#...................#',
'#.###.#.#####.#.###.#',
'#.....#...#...#.....#',
'#####.### # ###.#####',
'    #.#       #.#    ',
'#####.# ## ## #.#####',
'     .  #   #  .     ',
'#####.# ##### #.#####',
'    #.#       #.#    ',
'#####.# ##### #.#####',
'#.........#.........#',
'#.###.###.#.###.###.#',
'#o..#...........#..o#',
'###.#.#.#####.#.#.###',
'#.....#...#...#.....#',
'#.#######.#.#######.#',
'#...................#',
'#####################'];
const cols=21,rows=22,tile=24,ox=(c.width-cols*tile)/2,oy=(c.height-rows*tile)/2;
let dots,player,ghosts,score,lives,running=false,paused=false,last=0;
function resetAll(){dots=new Set();map.forEach((r,y)=>[...r].forEach((v,z)=>{if(v==='.'||v==='o')dots.add(z+','+y)}));score=0;lives=3;spawn();updateUI()}
function spawn(){player={x:10,y:16,px:10,py:16,dir:'left',next:'left',speed:5};ghosts=[{x:9,y:10,dir:'left',color:'#e56458',speed:3.3},{x:11,y:10,dir:'right',color:'#de9255',speed:3.05}];}
function wall(cx,cy){if(cy<0||cy>=rows)return true;if(cx<0||cx>=cols)return false;return map[cy][cx]==='#'}
const dv={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
function center(a){return Math.abs(a.x-Math.round(a.x))<.055&&Math.abs(a.y-Math.round(a.y))<.055}
function canMove(a,d){let [dx,dy]=dv[d];return !wall(Math.round(a.x)+dx,Math.round(a.y)+dy)}
function move(a,dt){if(center(a)){a.x=Math.round(a.x);a.y=Math.round(a.y);if(a.next&&canMove(a,a.next))a.dir=a.next;if(!canMove(a,a.dir))return}let [dx,dy]=dv[a.dir];a.x+=dx*a.speed*dt;a.y+=dy*a.speed*dt;if(a.x<-.5)a.x=cols-.5;if(a.x>cols-.5)a.x=-.5}
function ghostAI(g){if(!center(g))return;const reverse={left:'right',right:'left',up:'down',down:'up'};let options=Object.keys(dv).filter(d=>d!==reverse[g.dir]&&canMove(g,d));if(!options.length)options=[reverse[g.dir]];options.sort((a,b)=>{let [ax,ay]=dv[a],[bx,by]=dv[b];let da=Math.hypot(g.x+ax-player.x,g.y+ay-player.y),db=Math.hypot(g.x+bx-player.x,g.y+by-player.y);return (Math.random()<.75?da-db:Math.random()-.5)});g.next=options[0]}
function hit(){if(ghosts.some(g=>Math.hypot(g.x-player.x,g.y-player.y)<.62)){lives--;updateUI();if(lives<=0){end(false)}else spawn()}}
function update(dt){if(!running||paused)return;move(player,dt);if(center(player)){let k=Math.round(player.x)+','+Math.round(player.y);if(dots.delete(k)){score+=map[Math.round(player.y)][Math.round(player.x)]==='o'?50:10;updateUI();if(!dots.size)end(true)}}ghosts.forEach(g=>{ghostAI(g);move(g,dt)});hit()}
function updateUI(){scoreEl.textContent=score;livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#111722';x.fillRect(0,0,c.width,c.height);x.save();x.translate(ox,oy);for(let y=0;y<rows;y++)for(let z=0;z<cols;z++){if(map[y][z]==='#'){x.fillStyle='#2783de';roundRect(z*tile+2,y*tile+2,tile-4,tile-4,6);x.fill();}let k=z+','+y;if(dots.has(k)){x.fillStyle='#f4bd3f';x.beginPath();x.arc((z+.5)*tile,(y+.5)*tile,map[y][z]==='o'?5:2.4,0,Math.PI*2);x.fill()}}drawSnack(player);ghosts.forEach(drawGhost);x.restore();if(paused){x.fillStyle='rgba(17,23,34,.72)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='700 30px Arial';x.textAlign='center';x.fillText('Pause',c.width/2,c.height/2)}}
function roundRect(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function drawSnack(p){let cx=(p.x+.5)*tile,cy=(p.y+.5)*tile,ang={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[p.dir],mouth=.22+Math.abs(Math.sin(performance.now()/90))*.18;x.fillStyle='#f4bd3f';x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,10,ang+mouth,ang+Math.PI*2-mouth);x.closePath();x.fill()}
function drawGhost(g){let cx=(g.x+.5)*tile,cy=(g.y+.5)*tile;x.fillStyle=g.color;x.beginPath();x.arc(cx,cy-1,10,Math.PI,0);x.lineTo(cx+10,cy+9);x.lineTo(cx+5,cy+5);x.lineTo(cx,cy+9);x.lineTo(cx-5,cy+5);x.lineTo(cx-10,cy+9);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(cx-4,cy-2,2.7,0,7);x.arc(cx+4,cy-2,2.7,0,7);x.fill();x.fillStyle='#111722';x.beginPath();x.arc(cx-3,cy-2,1.2,0,7);x.arc(cx+5,cy-2,1.2,0,7);x.fill()}
function loop(t){let dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();requestAnimationFrame(loop)}
function end(win){running=false;title.textContent=win?'Alles weggeknuspert.':'Erwischt.';text.textContent=win?`Sauber. ${score} Punkte und kein Krümel übrig.`:`${score} Punkte. Nochmal mit weniger Drama?`;startBtn.textContent='Nochmal spielen';overlay.hidden=false}
function setDir(d){if(running)player.next=d}
document.addEventListener('keydown',e=>{const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(keys[e.key]){e.preventDefault();setDir(keys[e.key])}if(e.key.toLowerCase()==='p'&&running)paused=!paused});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));startBtn.addEventListener('click',()=>{resetAll();running=true;paused=false;overlay.hidden=true;c.focus()});resetAll();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
